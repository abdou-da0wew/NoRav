# NoRav HTTPS edge. Install as /etc/nginx/conf.d/norav.conf.
# The dashboard and proxy intentionally use separate HTTPS origins (ports).
map $http_upgrade $norav_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 7845 ssl;
    listen [::]:7845 ssl;
    server_name celestial-bot.work.gd;
    if ($host != celestial-bot.work.gd) { return 444; }

    ssl_certificate     /etc/letsencrypt/live/celestial-bot.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celestial-bot.work.gd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoRavTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 33m;

    location / {
        proxy_pass http://127.0.0.1:17845;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $norav_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
    }
}

server {
    listen 8099 ssl;
    listen [::]:8099 ssl;
    server_name celestial-bot.work.gd;
    if ($host != celestial-bot.work.gd) { return 444; }

    ssl_certificate     /etc/letsencrypt/live/celestial-bot.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/celestial-bot.work.gd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoRavTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 33m;

    location / {
        proxy_pass http://127.0.0.1:17899;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $norav_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}
